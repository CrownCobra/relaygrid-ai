name: starter-checks
on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local website links
        run: python scripts/check_site.py
      - name: Check browser JavaScript syntax
        run: |
          for f in public/assets/js/*.js functions/**/*.js functions/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
